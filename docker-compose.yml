version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ode-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ode_user
      POSTGRES_PASSWORD: ode_password
      POSTGRES_DB: ode_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/database/src/sql/001_initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./packages/database/src/sql/002_seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ode_user -d ode_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ode-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
